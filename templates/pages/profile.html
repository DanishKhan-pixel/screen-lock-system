{% extends "base.html" %}
{% block title %}Profile{% endblock %}
{% block crumb %}Account / <strong>Profile</strong>{% endblock %}
{% block content %}
<div class="hero">
    <div>
        <h1>Profile</h1>
        <p class="muted">These details appear in the directory. Username stays {{ user.username }}.</p>
    </div>
</div>
<section class="card">
    <form method="post" action="{% url 'pages:update_profile' %}">
        {% csrf_token %}
        {{ form.non_field_errors }}
        {{ form.as_p }}
        <button type="submit">Save profile</button>
    </form>
</section>
{% endblock %}
